appId: com.unishell.desktop
productName: UniShell
asar: true
directories:
  output: release/mac
# 显式关闭发布，理由同 windows.yml：CI 上不隐式推断发布提供方，避免缺少凭据导致打包失败。
publish: null
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/config.example.json
    to: config.example.json
mac:
  category: public.app-category.utilities
  # 正式图标：Dock、Finder、磁盘映像与关于面板。运行时 Dock 图标由规格 §5.4 覆盖。
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  forceCodeSigning: false
