appId: com.unishell.desktop
productName: UniShell
asar: true
directories:
  output: release/windows
# 显式关闭发布：本基地的自动更新基础设施不在范围内，产物只通过 CI artifact 分发。
# 不写 publish 时，electron-builder 26 在 CI 环境会隐式启用发布
# （"Implicit publishing triggered by CI detection"），并按 git 远程地址把 GitHub 推断为
# 发布提供方；生成 block map / latest.yml 时构造 GitHub publisher，缺少 GH_TOKEN 就直接
# 让打包失败（错误出现在 block map 之后）。置 null 同时关闭隐式发布与更新信息文件生成。
publish: null
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/config.example.json
    to: config.example.json
win:
  # 正式安装包图标：安装程序界面、桌面与开始菜单快捷方式、任务栏固定项。
  # 运行时窗口/托盘图标由规格 §5.4 的用户配置或内置默认图标决定，与此处独立。
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 向导式安装：保留「选择安装位置」页，用户可自选盘符与目录（规格 §13）。
  # 默认仍装到当前用户目录（%LOCALAPPDATA%\Programs\UniShell），不需要 UAC。
  # 注意：allowToChangeInstallationDirectory 仅对 oneClick: false 有效，
  # 与 oneClick: true 同时设置会被 electron-builder 拒绝。
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
