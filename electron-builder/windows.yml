appId: com.unishell.desktop
productName: UniShell
asar: true
directories:
  output: release/windows
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/config.example.json
    to: config.example.json
win:
  # 正式安装包图标：安装程序界面、桌面与开始菜单快捷方式、任务栏固定项。
  # 运行时窗口/托盘图标由规格 §5.4 的用户配置或内置默认图标决定，与此处独立。
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # 一键安装：双击后一步装到当前用户目录（%LOCALAPPDATA%\Programs\UniShell），
  # 不需要 UAC；不提供目录选择（规格 §13）。
  oneClick: true
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
