appId: com.unishell.desktop
productName: UniShell
asar: true
directories:
  output: release/linux
# 显式关闭发布，理由同 windows.yml：CI 上不隐式推断发布提供方，避免缺少凭据导致打包失败。
publish: null
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/config.example.json
    to: config.example.json
linux:
  category: Utility
  maintainer: ${env.UNI_SHELL_LINUX_MAINTAINER}
  syncDesktopName: true
  # 正式图标：DEB 桌面条目与 AppImage。electron-builder 要求 >=512x512 的 PNG。
  icon: resources/icon-512.png
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
