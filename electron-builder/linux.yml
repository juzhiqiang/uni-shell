appId: com.unishell.desktop
productName: UniShell
asar: true
directories:
  output: release/linux
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/config.example.json
    to: config.example.json
linux:
  category: Utility
  maintainer: ${env.UNI_SHELL_LINUX_MAINTAINER}
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
