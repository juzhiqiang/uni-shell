name: Cross-platform packages

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ALLOW_UNSIGNED_MAC: 'true'

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restrict release packaging to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release packaging must be dispatched from main."
            exit 1
          fi
      - name: Reject an existing release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/$TAG"
          TAG_LOOKUP_STATUS=$?
          set -e
          if [ "$TAG_LOOKUP_STATUS" -eq 0 ]; then
            echo "Release tag $TAG already exists; versions cannot be published more than once."
            exit 1
          fi
          if [ "$TAG_LOOKUP_STATUS" -ne 2 ]; then
            echo "Unable to check whether release tag $TAG exists."
            exit "$TAG_LOOKUP_STATUS"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - run: node scripts/verify-release.ts --platform=windows --release-dir=release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/windows/
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build macOS packages
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$CSC_KEY_PASSWORD" ]; then unset CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID; fi
          if [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then unset APPLE_APP_SPECIFIC_PASSWORD; fi
          if [ -z "$APPLE_TEAM_ID" ]; then unset APPLE_TEAM_ID; fi
          npm run build:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: node scripts/verify-release.ts --platform=mac --release-dir=release --allow-unsigned-mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/mac/
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: checks
    runs-on: ubuntu-22.04
    env:
      UNI_SHELL_LINUX_MAINTAINER: ${{ secrets.UNI_SHELL_LINUX_MAINTAINER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install DEB and AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ruby ruby-dev libfuse2
          sudo gem install --no-document fpm
      - run: npm ci
      - run: npm run build:linux
      - run: node scripts/verify-release.ts --platform=linux --release-dir=release
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/linux/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [windows, macos, linux]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release/mac
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release/linux
      - name: Verify complete release set
        run: npm run verify:release
      - name: Assemble downloadable bundle
        run: |
          mkdir -p release-bundle/windows release-bundle/mac release-bundle/linux
          cp release/windows/*.exe release-bundle/windows/
          cp release/windows/*.zip release-bundle/windows/
          cp release/mac/*.dmg release-bundle/mac/
          cp release/mac/*.zip release-bundle/mac/
          cp release/linux/*.deb release-bundle/linux/
          cp release/linux/*.AppImage release-bundle/linux/
          cp release/linux/*.zip release-bundle/linux/
          cp release/release-manifest.json release-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: release-all-platforms
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release create "$TAG" \
            release-bundle/windows/* \
            release-bundle/mac/* \
            release-bundle/linux/* \
            release-bundle/release-manifest.json \
            --title "UniShell v${VERSION}" \
            --notes "UniShell 跨平台自动打包构建产物（版本 v${VERSION}）"
